<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Profile — Lily</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap");

      :root {
        --ink: #0f1a1c;
        --ink-muted: #41565b;
        --paper: #f4f1e9;
        --accent: #d96c2c;
        --mist: rgba(15, 26, 28, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Space Grotesk", system-ui, -apple-system, sans-serif;
        color: var(--ink);
        min-height: 100vh;
        background: radial-gradient(800px 400px at 20% 10%, #fff4e3 0%, transparent 70%),
          radial-gradient(800px 500px at 90% 0%, #e8f2ef 0%, transparent 70%),
          var(--paper);
        display: grid;
        place-items: center;
        padding: 40px 20px;
      }

      .card {
        width: min(520px, 100%);
        background: rgba(255, 255, 255, 0.92);
        border-radius: 24px;
        border: 1px solid var(--mist);
        box-shadow: 0 20px 45px rgba(15, 26, 28, 0.12);
        padding: 28px;
      }

      h1 {
        font-family: "Fraunces", serif;
        margin: 0 0 12px;
      }

      .meta {
        color: var(--ink-muted);
        margin-bottom: 18px;
      }

      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 0;
        border-top: 1px solid var(--mist);
      }

      .row:first-of-type {
        border-top: none;
      }

      .btn {
        border: none;
        padding: 10px 18px;
        border-radius: 999px;
        font-weight: 600;
        background: var(--accent);
        color: #fff8f2;
        cursor: pointer;
        text-decoration: none;
      }

      .link {
        color: var(--ink-muted);
        text-decoration: none;
        font-size: 0.95rem;
      }

      form {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Your profile</h1>
      <div class="meta">Signed in as {{ request.user.email|default:request.user.username }}</div>

      <div class="row">
        <span>Account status</span>
        <strong>Active</strong>
      </div>
      <div class="row">
        <span>Member since</span>
        <strong>{{ request.user.date_joined|date:"M d, Y" }}</strong>
      </div>

      <div class="row">
        <a class="link" href="/">Back to home</a>
        <form method="post" action="{% url 'account_logout' %}">
          {% csrf_token %}
          <button class="btn" type="submit">Log out</button>
        </form>
      </div>
    </div>
  </body>
</html>
