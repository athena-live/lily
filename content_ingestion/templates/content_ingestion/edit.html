<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lily — Slop Detector</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap");

      :root {
        --ink: #0b1218;
        --ink-muted: #4a5a66;
        --paper: #f5f4f1;
        --panel: #ffffff;
        --accent: #1c4fd7;
        --accent-dark: #123aa5;
        --accent-soft: rgba(28, 79, 215, 0.12);
        --mist: rgba(11, 18, 24, 0.08);
        --glow: rgba(28, 79, 215, 0.22);
        --danger: #b12a2a;
        --success: #2f7d55;
        --gold: #e1b757;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Space Grotesk", system-ui, -apple-system, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(900px 500px at 15% 10%, rgba(28, 79, 215, 0.12) 0%, transparent 65%),
          radial-gradient(900px 500px at 90% 0%, rgba(225, 183, 87, 0.18) 0%, transparent 70%),
          var(--paper);
        min-height: 100vh;
      }

      .page {
        max-width: 1160px;
        margin: 0 auto;
        padding: 36px 20px 80px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        gap: 28px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        background: rgba(255, 255, 255, 0.75);
        border: 1px solid rgba(11, 18, 24, 0.08);
        border-radius: 20px;
        padding: 14px 20px;
        box-shadow: 0 12px 30px rgba(11, 18, 24, 0.08);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      .brand-badge {
        width: 40px;
        height: 40px;
        border-radius: 14px;
        background: linear-gradient(145deg, #e7eefc, #1c4fd7);
        box-shadow: 0 12px 25px var(--glow);
        display: grid;
        place-items: center;
        color: #0f2b7f;
        font-weight: 700;
      }

      .brand-meta {
        display: flex;
        flex-direction: column;
      }

      .brand-meta span {
        font-size: 0.75rem;
        color: var(--ink-muted);
      }

      .nav a {
        color: var(--ink-muted);
        text-decoration: none;
        font-size: 0.95rem;
        margin-left: 18px;
      }

      .title {
        font-family: "Fraunces", serif;
        font-size: clamp(2.2rem, 4vw, 3.2rem);
        margin: 0 0 6px;
      }

      .meta {
        color: var(--ink-muted);
        font-size: 0.95rem;
      }

      .meta-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border-radius: 999px;
        padding: 6px 12px;
        background: rgba(11, 18, 24, 0.06);
        font-size: 0.85rem;
        color: var(--ink-muted);
        margin-bottom: 10px;
      }

      .card {
        background: var(--panel);
        border: 1px solid rgba(11, 18, 24, 0.08);
        border-radius: 22px;
        padding: 24px;
        box-shadow: 0 20px 40px rgba(11, 18, 24, 0.12);
      }

      form {
        display: grid;
        gap: 18px;
      }

      label {
        font-weight: 600;
        margin-bottom: 8px;
        display: inline-block;
      }

      input,
      textarea {
        width: 100%;
        border: 1px solid rgba(11, 18, 24, 0.12);
        border-radius: 16px;
        padding: 12px 14px;
        font-size: 1rem;
        font-family: "Space Grotesk", system-ui, -apple-system, sans-serif;
        background: #fbfbfd;
      }

      textarea {
        min-height: 260px;
        resize: vertical;
        line-height: 1.5;
      }

      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .btn {
        border: none;
        padding: 10px 18px;
        border-radius: 999px;
        font-weight: 600;
        background: var(--accent);
        color: #f4f7ff;
        cursor: pointer;
        text-decoration: none;
        box-shadow: 0 12px 25px var(--glow);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .btn-ghost {
        background: rgba(11, 18, 24, 0.06);
        color: var(--ink);
        border: 1px solid rgba(11, 18, 24, 0.1);
        box-shadow: none;
      }

      .btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 18px 35px var(--glow);
      }

      .alert {
        padding: 12px 16px;
        border-radius: 14px;
        font-weight: 600;
        background: rgba(177, 42, 42, 0.1);
        color: var(--danger);
        border: 1px solid rgba(177, 42, 42, 0.2);
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <div class="brand">
          <div class="brand-badge">L</div>
          <div class="brand-meta">
            <div>Lily</div>
            <span>Slop Detector</span>
          </div>
        </div>
        <nav class="nav">
          <a href="{% url 'content_ingestion:list' %}">All content</a>
          <a href="/profile/">Profile</a>
        </nav>
      </header>

      <section>
        <div class="meta-pill">Edit ingestion</div>
        <h1 class="title">Edit content</h1>
        <div class="meta">Update name or raw text below.</div>
      </section>

      <div class="card">
        {% if error %}
          <div class="alert">{{ error }}</div>
        {% endif %}
        <form method="post">
          {% csrf_token %}
          <div>
            <label for="name">Content name</label>
            <input id="name" name="name" type="text" value="{{ name }}" maxlength="200" required />
          </div>
          <div>
            <label for="content">Paste content</label>
            <textarea id="content" name="content" required>{{ content }}</textarea>
          </div>
          <div class="actions">
            <button class="btn" type="submit">Save changes</button>
            <a class="btn btn-ghost" href="{% url 'content_ingestion:detail' item.id %}">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
