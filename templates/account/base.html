<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Lily{% endblock %}</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap");

      :root {
        --ink: #0f1a1c;
        --ink-muted: #41565b;
        --paper: #f4f1e9;
        --accent: #d96c2c;
        --accent-dark: #a44b1e;
        --mist: rgba(15, 26, 28, 0.12);
        --panel: rgba(255, 255, 255, 0.9);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Space Grotesk", system-ui, -apple-system, sans-serif;
        color: var(--ink);
        min-height: 100vh;
        background: radial-gradient(800px 400px at 20% 10%, #fff4e3 0%, transparent 70%),
          radial-gradient(800px 500px at 90% 0%, #e8f2ef 0%, transparent 70%),
          var(--paper);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
      }

      .auth-shell {
        width: min(980px, 100%);
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 28px;
      }

      .brand-panel {
        padding: 28px;
        border-radius: 26px;
        background: linear-gradient(160deg, #fff3e3 0%, #f6f1e8 40%, #e6f1ee 100%);
        border: 1px solid var(--mist);
        box-shadow: 0 20px 50px rgba(15, 26, 28, 0.12);
      }

      .brand-badge {
        width: 52px;
        height: 52px;
        border-radius: 18px;
        background: linear-gradient(145deg, #ffe2c6, #d96c2c);
        display: grid;
        place-items: center;
        font-weight: 700;
        color: #5a210a;
        margin-bottom: 16px;
      }

      .brand-panel h1 {
        font-family: "Fraunces", serif;
        font-size: 2.2rem;
        margin: 0 0 12px;
      }

      .brand-panel p {
        margin: 0;
        color: var(--ink-muted);
        line-height: 1.5;
      }

      .auth-panel {
        padding: 28px;
        border-radius: 26px;
        background: var(--panel);
        border: 1px solid var(--mist);
        box-shadow: 0 20px 50px rgba(15, 26, 28, 0.12);
        backdrop-filter: blur(8px);
      }

      .auth-panel h2 {
        margin: 0 0 8px;
        font-size: 1.5rem;
      }

      .auth-panel p {
        margin: 0 0 18px;
        color: var(--ink-muted);
      }

      form {
        display: grid;
        gap: 12px;
      }

      label {
        font-size: 0.9rem;
        color: var(--ink-muted);
      }

      input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--mist);
        background: #fff;
        font-size: 1rem;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      .btn {
        border: none;
        padding: 12px 18px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 0.98rem;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .btn-primary {
        background: var(--accent);
        color: #fff8f2;
        box-shadow: 0 12px 25px rgba(217, 108, 44, 0.2);
      }

      .btn-secondary {
        background: transparent;
        border: 1px solid var(--mist);
        color: var(--ink);
      }

      .btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 16px 30px rgba(217, 108, 44, 0.2);
      }

      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--ink-muted);
        font-size: 0.85rem;
      }

      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--mist);
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 10px;
        font-size: 0.9rem;
      }

      .links a {
        color: var(--accent-dark);
        text-decoration: none;
      }

      .errors {
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(214, 73, 73, 0.12);
        color: #8a1c1c;
        font-size: 0.9rem;
      }

      .muted {
        color: var(--ink-muted);
        font-size: 0.9rem;
      }

      .social-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        text-decoration: none;
      }

      @media (max-width: 700px) {
        body {
          padding: 24px 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="auth-shell">
      <div class="brand-panel">
        <div class="brand-badge">L</div>
        <h1>Lily</h1>
        <p>
          AI slop detector with human-grade taste. Keep the signal high and the noise low.
        </p>
      </div>
      <div class="auth-panel">
        {% block content %}{% endblock %}
      </div>
    </div>
  </body>
</html>
