{% load static %}
<!DOCTYPE html>
<html lang="en"{% if theme %} data-theme="{{ theme }}"{% endif %}>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Lily{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/lily.css' %}" />
  </head>
  <body class="auth">
    <div class="auth-shell">
      <div class="brand-panel">
        <div class="brand-badge">L</div>
        <h1>Lily</h1>
        <p>
          AI slop detector with human-grade taste. Keep the signal high and the noise low.
        </p>
      </div>
      <div class="auth-panel">
        {% block content %}{% endblock %}
      </div>
    </div>
    <script defer src="{% static 'js/theme.js' %}"></script>
  </body>
</html>
